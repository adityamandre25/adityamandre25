<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 58" width="460" height="58" fill="none">
  <defs>
    <!-- Vibrant Royal / Electric Blue Glow Filter -->
    <filter id="electric-glow" x="-20%" y="-30%" width="150%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip Path revealing characters letter-by-letter -->
    <clipPath id="type-clip">
      <rect x="0" y="0" height="58" width="0">
        <animate attributeName="width"
                 calcMode="discrete"
                 keyTimes="0.0;0.025;0.049;0.074;0.098;0.123;0.148;0.172;0.197;0.222;0.246;0.271;0.295;0.32;0.88;0.96;1.0"
                 values="0;48.1;81.2;114.2;147.3;180.4;213.5;246.5;279.6;312.7;345.8;378.8;411.9;445.0;445.0;0;0"
                 dur="6s"
                 repeatCount="indefinite" />
      </rect>
    </clipPath>

    <!-- Electric Cyan to Royal Blue Gradient -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="55%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <style>
    .header-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Segoe UI', 'Consolas', monospace;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 4px;
      fill: url(#header-grad);
    }
    .glow-layer {
      font-family: 'JetBrains Mono', 'Fira Code', 'Segoe UI', 'Consolas', monospace;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 4px;
      fill: #1D4ED8;
      filter: url(#electric-glow);
      opacity: 0.9;
    }
  </style>

  <!-- Animated Heading -->
  <g clip-path="url(#type-clip)">
    <text x="2" y="42" class="glow-layer" textLength="430" lengthAdjust="spacing">ADITYA MANDRE</text>
    <text x="2" y="42" class="header-text" textLength="430" lengthAdjust="spacing">ADITYA MANDRE</text>
  </g>
</svg>
