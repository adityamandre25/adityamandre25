name: Update Digital Aquarium

on:
  schedule:
    - cron: '0 0 * * *' # Refreshes daily at midnight UTC
  workflow_dispatch:     # Allows manual trigger via Actions tab
  push:
    branches:
      - main
    paths:
      - 'scripts/generate_aquarium.py'
      - '.github/workflows/aquarium.yml'

jobs:
  refresh-aquarium:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow numpy

      - name: Generate Digital Aquarium
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_aquarium.py --username adityamandre25 --output assets/aquarium.gif

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/aquarium.gif
          if git diff --staged --quiet; then
            echo "No changes in aquarium ecosystem."
          else
            git commit -m "chore(aquarium): refresh digital aquarium ecosystem [skip ci]"
            git push
          fi
