name: Update Living Digital Aquarium

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch:     # Manual trigger via GitHub Actions tab
    inputs:
      force_rebuild:
        description: 'Force visual rebuild regardless of PR count changes'
        required: false
        type: boolean
        default: false
  pull_request:
    types: [closed]
  push:
    branches:
      - main
    paths:
      - 'scripts/generate_aquarium.py'
      - '.github/workflows/aquarium.yml'

jobs:
  evolve-aquarium:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow numpy

      - name: Evolve & Generate Aquarium
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.force_rebuild }}" = "true" ]; then
            FLAGS="--force"
          fi
          python scripts/generate_aquarium.py \
            --username adityamandre25 \
            --token "$GITHUB_TOKEN" \
            --output assets/aquarium.gif \
            --state assets/aquarium_state.json \
            --bg assets/aquarium_background.jpg \
            $FLAGS

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/aquarium.gif assets/aquarium_state.json
          if git diff --staged --quiet; then
            echo "Aquarium ecosystem is already synchronized with GitHub activity."
          else
            git commit -m "chore(aquarium): evolve digital ecosystem state [skip ci]"
            git push
          fi
