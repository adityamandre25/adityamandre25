name: Koi

on:
  schedule:
  # Every Sunday at 00:20 UTC (5:50 AM IST)
  - cron: "20 0 * * 0"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yalongwastaken/git-koi@v1
        with:
          login: adityamandre25
          body: gold
          output-dir: koi
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi [skip ci]"
          git push --quiet
